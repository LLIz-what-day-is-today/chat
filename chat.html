<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天</title>
<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#222;background:#fafafa}
  button{font:inherit;cursor:pointer;border:0;border-radius:6px;background:#333;color:#fff;padding:0 16px;height:38px}
  button:active{opacity:.75}
  #login{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  #username{width:240px;height:38px;padding:0 12px;font:inherit;border:1px solid #ccc;border-radius:6px;outline:none}
  #username:focus{border-color:#888}
  #chat{height:100vh;display:flex;flex-direction:column}
  #messages{flex:1;overflow-y:auto;padding:16px}
  .msg{margin-bottom:16px}
  .who{font-size:12px;color:#999;margin-bottom:4px}
  .content{white-space:pre-wrap;word-break:break-word}
  .content img,.content video{display:block;max-width:280px;max-height:320px;border-radius:6px}
  .content a{color:#0a58ca}
  #bar{border-top:1px solid #e5e5e5;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px}
  #tools{display:flex;gap:8px}
  #tools button{height:30px;padding:0 12px;background:#eee;color:#333;font-size:13px}
  #row{display:flex;gap:8px}
  #text{flex:1;height:38px;padding:0 12px;font:inherit;border:1px solid #ccc;border-radius:6px;outline:none}
  #text:focus{border-color:#888}
</style>
</head>
<body>

<div id="login">
  <label for="username">请输入用户名:</label>
  <input id="username" maxlength="16" autocomplete="off">
  <button id="done">完成</button>
</div>

<div id="chat" hidden>
  <div id="messages"></div>
  <div id="bar">
    <div id="tools">
      <button id="pickImage">图片</button>
      <button id="pickVideo">视频</button>
      <button id="pickFile">文件</button>
    </div>
    <div id="row">
      <input id="text" placeholder="输入消息">
      <button id="send">发送</button>
    </div>
  </div>
  <input type="file" id="imageInput" accept="image/*" multiple hidden>
  <input type="file" id="videoInput" accept="video/*" multiple hidden>
  <input type="file" id="fileInput" multiple hidden>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  /* ====== 只改这两行 ====== */
  const SUPABASE_URL = 'https://xxxxxxxx.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOi...';
  /* ====================== */
  const BUCKET = 'chat-files';

  const $ = s => document.querySelector(s);
  const messagesEl = $('#messages');
  let user = '';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const rendered = new Set();

  function render(m) {
    if (rendered.has(m.id)) return;
    rendered.add(m.id);

    const box = document.createElement('div');
    box.className = 'msg';

    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = m.user_name;

    const c = document.createElement('div');
    c.className = 'content';

    if (m.type === 'text') {
      c.textContent = m.text_content || '';
    } else if (m.type === 'image') {
      const img = document.createElement('img');
      img.src = m.file_url;
      img.loading = 'lazy';
      c.appendChild(img);
    } else if (m.type === 'video') {
      const v = document.createElement('video');
      v.src = m.file_url;
      v.controls = true;
      v.preload = 'metadata';
      c.appendChild(v);
    } else {
      const a = document.createElement('a');
      a.href = m.file_url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = m.file_name || '文件';
      c.appendChild(a);
    }

    box.append(who, c);
    messagesEl.appendChild(box);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function loadHistory() {
    const { data, error } = await sb.from('messages')
      .select('*').order('id', { ascending: true }).limit(500);
    if (error) { console.error(error); return; }
    data.forEach(render);
  }

  function subscribe() {
    sb.channel('messages')
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'messages' },
        p => render(p.new))
      .subscribe();
  }

  async function upload(file) {
    const ext = file.name.includes('.') ? '.' + file.name.split('.').pop() : '';
    const path = Date.now() + '-' + Math.random().toString(36).slice(2, 10) + ext;
    const { error } = await sb.storage.from(BUCKET).upload(path, file);
    if (error) throw error;
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  async function sendText() {
    const t = $('#text').value.trim();
    if (!t) return;
    $('#text').value = '';
    const { data, error } = await sb.from('messages')
      .insert({ user_name: user, type: 'text', text_content: t })
      .select().single();
    if (error) { alert(error.message); return; }
    render(data);
  }

  async function sendFiles(files) {
    for (const f of files) {
      const type = f.type.startsWith('image/') ? 'image'
                 : f.type.startsWith('video/') ? 'video'
                 : 'file';
      let url;
      try { url = await upload(f); }
      catch (e) { alert('上传失败：' + f.name); continue; }

      const { data, error } = await sb.from('messages')
        .insert({ user_name: user, type, file_url: url, file_name: f.name })
        .select().single();
      if (error) { alert(error.message); continue; }
      render(data);
    }
  }

  function login() {
    const name = $('#username').value.trim();
    if (!name) return;
    user = name;
    $('#login').hidden = true;
    $('#chat').hidden = false;
    loadHistory();
    subscribe();
    $('#text').focus();
  }

  $('#done').onclick = login;
  $('#username').onkeydown = e => { if (e.key === 'Enter') login(); };
  $('#send').onclick = sendText;
  $('#text').onkeydown = e => { if (e.key === 'Enter') sendText(); };
  $('#pickImage').onclick = () => $('#imageInput').click();
  $('#pickVideo').onclick = () => $('#videoInput').click();
  $('#pickFile').onclick  = () => $('#fileInput').click();

  ['#imageInput', '#videoInput', '#fileInput'].forEach(sel => {
    const input = $(sel);
    input.onchange = () => {
      if (input.files.length) sendFiles([...input.files]);
      input.value = '';
    };
  });
})();
</script>
</body>
</html>
