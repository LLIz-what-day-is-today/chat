<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<title>聊天室</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #ededed;
  color: #1a1a1a;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- 登录 ---------- */
#login {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: #fff; padding: 24px;
}
#login .box { width: 100%; max-width: 300px; }
#login .label { font-size: 17px; font-weight: 500; margin-bottom: 14px; }
#login input {
  width: 100%; height: 46px; padding: 0 14px;
  font-size: 16px; color: #111;
  border: 1px solid #d9d9d9; border-radius: 10px;
  outline: none; background: #fafafa;
}
#login input:focus { border-color: #07c160; background: #fff; }
#login button {
  width: 100%; height: 46px; margin-top: 14px;
  font-size: 16px; color: #fff;
  background: #07c160; border: 0; border-radius: 10px; cursor: pointer;
}
#login button:active { opacity: .85; }
#err { color: #e64340; font-size: 13px; height: 18px; margin-top: 8px; }

/* ---------- 主体 ---------- */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#app[hidden] { display: none; }

header {
  flex: none; height: calc(50px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 16px 0;
  display: flex; align-items: center; justify-content: space-between;
  background: #f7f7f7; border-bottom: 1px solid #ddd;
}
#title { font-size: 16px; font-weight: 600; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
#status {
  flex: none; margin-left: 10px; padding: 6px 12px;
  display: flex; align-items: center; gap: 6px;
  font-size: 14px; color: #333;
  border-radius: 14px; cursor: pointer; user-select: none;
  background: #fff; border: 1px solid #e2e2e2;
}
#status:active { background: #f0f0f0; }
#statusDot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #ccc; flex: none;
}
#status.on #statusDot { background: #07c160; }
#status.off #statusDot { background: #e64340; }

#msgs {
  flex: 1 1 auto; overflow-y: auto; padding: 12px 12px 4px;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}

.msg { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 14px; }
.msg.me { align-items: flex-end; }
.meta { margin: 0 4px 4px; font-size: 11px; color: #999; }
.bubble {
  max-width: 78%; padding: 9px 13px;
  background: #fff; border-radius: 4px 12px 12px 12px;
  font-size: 15px; line-height: 1.5;
  white-space: pre-wrap; word-wrap: break-word; word-break: break-word;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
.msg.me .bubble { background: #95ec69; border-radius: 12px 4px 12px 12px; }
.bubble.media { padding: 4px; white-space: normal; }
.bubble img, .bubble video {
  display: block; max-width: 100%; max-height: 320px; border-radius: 9px;
}
.bubble audio { display: block; width: 220px; }
.bubble a { color: #576b95; text-decoration: none; font-size: 14px; word-break: break-all; }

#bar {
  flex: none; display: flex; align-items: flex-end; gap: 8px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: #f7f7f7; border-top: 1px solid #ddd;
}
#fileBtn {
  flex: none; width: 38px; height: 38px; padding: 0;
  font-size: 22px; line-height: 1; color: #555;
  background: #fff; border: 1px solid #ddd; border-radius: 50%; cursor: pointer;
}
#input {
  flex: 1 1 auto; min-height: 38px; max-height: 120px;
  padding: 8px 12px; font-size: 15px; font-family: inherit; line-height: 1.4;
  border: 1px solid #ddd; border-radius: 19px; outline: none;
  resize: none; background: #fff; overflow-y: auto;
}
#input:focus { border-color: #07c160; }
#sendBtn {
  flex: none; height: 38px; padding: 0 16px;
  font-size: 15px; color: #fff; background: #07c160;
  border: 0; border-radius: 19px; cursor: pointer;
}
#sendBtn:active, #fileBtn:active { opacity: .8; }

/* ---------- 侧边栏 ---------- */
#mask {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(0,0,0,.35);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
#mask.open { opacity: 1; pointer-events: auto; }

#sidebar {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 260px; max-width: 78vw;
  z-index: 60;
  background: #fff;
  transform: translateX(100%);
  transition: transform .25s ease;
  box-shadow: -2px 0 14px rgba(0,0,0,.12);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
#sidebar.open { transform: translateX(0); }

.sb-head {
  flex: none; padding: 16px 20px 12px;
  font-size: 15px; font-weight: 600; color: #333;
}
.sb-head span { color: #07c160; }
.sb-line { flex: none; height: 1px; background: #eee; margin: 0 16px; }
#peerList {
  flex: 1 1 auto; overflow-y: auto; padding: 8px 0;
  -webkit-overflow-scrolling: touch;
}
.peer {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px; font-size: 15px; color: #333;
}
.peer .dot {
  width: 8px; height: 8px; border-radius: 50%; background: #07c160; flex: none;
}
.peer.me { color: #07c160; font-weight: 500; }
.peer.me .dot { background: #07c160; box-shadow: 0 0 0 3px rgba(7,193,96,.15); }

.lightbox {
  position: fixed; inset: 0; z-index: 100; padding: 16px;
  background: rgba(0,0,0,.9);
  display: flex; align-items: center; justify-content: center;
}
.lightbox img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="label">请输入用户名:</div>
    <input id="uname" type="text" maxlength="20" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="用户名">
    <button id="done">完成</button>
    <div id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div id="title">聊天室</div>
    <div id="status">
      <span id="statusDot"></span>
      <span id="statusText">0</span>
    </div>
  </header>
  <div id="msgs"></div>
  <div id="bar">
    <button id="fileBtn" title="上传文件">＋</button>
    <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
    <button id="sendBtn">发送</button>
  </div>
  <input type="file" id="fileInput" hidden multiple>
</div>

<div id="mask"></div>
<div id="sidebar">
  <div class="sb-head">在线人数: <span id="onlineCount">0</span></div>
  <div class="sb-line"></div>
  <div id="peerList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  'use strict';

  /* ============ 配置 ============ */
  var BROKER        = 'wss://broker.emqx.io:8084/mqtt';
  var TOPIC         = 'ghchat/room/v1/8f2c1a';   // 想换房间就改这里
  var MAX_FILE      = 5 * 1024 * 1024;
  var CHUNK         = 80000;
  var HEARTBEAT_MS  = 15000;
  var PEER_TIMEOUT  = 45000;

  /* ============ 工具 ============ */
  var $ = function (id) { return document.getElementById(id); };

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function timeStr(t) {
    var d = new Date(t), n = new Date();
    var p = function (x) { return x < 10 ? '0' + x : '' + x; };
    var hm = p(d.getHours()) + ':' + p(d.getMinutes());
    return d.toDateString() === n.toDateString()
      ? hm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
  }
  function sizeStr(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k);
          localStorage.setItem(k, v); } catch (e) {}
    return null;
  }

  /* ============ 状态 ============ */
  var username  = '';
  var client    = null;
  var connected = false;
  var seen      = Object.create(null);
  var incoming  = Object.create(null);
  var peers     = Object.create(null);

  /* ============ 登录 ============ */
  $('uname').value = store('chat_username') || '';

  $('done').onclick = function () {
    var v = $('uname').value.trim();
    if (!v) { $('err').textContent = '用户名不能为空'; $('uname').focus(); return; }
    username = v;
    store('chat_username', v);
    start();
  };
  $('uname').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('done').click(); }
  });

  function start() {
    $('login').style.display = 'none';
    $('app').hidden = false;
    $('title').textContent = '聊天室 · ' + username;
    peers[username] = Date.now();
    renderPeers();
    loadHistory();
    connect();
  }

  /* ============ 连接 ============ */
  function connect() {
    if (typeof mqtt === 'undefined') {
      console.error('[chat] mqtt.min.js 未加载');
      return;
    }
    try {
      client = mqtt.connect(BROKER, {
        clientId: 'web_' + Math.random().toString(16).slice(2, 10),
        clean: true,
        keepalive: 30,
        reconnectPeriod: 3000,
        connectTimeout: 10000
      });
    } catch (e) {
      console.error('[chat] connect 异常', e);
      return;
    }

    client.on('connect', function () {
      connected = true;
      console.log('[chat] 已连接');
      client.subscribe(TOPIC, { qos: 0 });
      publish({ t: 'join', user: username, time: Date.now() });
      publish({ t: 'who',  user: username, time: Date.now() });
      startHeartbeat();
      renderPeers();
    });

    client.on('close', function () {
      connected = false;
      renderPeers();
    });
    client.on('error', function (err) {
      console.error('[chat] 错误', err);
    });
    client.on('message', function (topic, payload) {
      var m;
      try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      onMessage(m);
    });
  }

  function publish(obj) {
    if (!client || !connected) return false;
    try { client.publish(TOPIC, JSON.stringify(obj), { qos: 0 }); return true; }
    catch (e) { return false; }
  }

  /* ============ 心跳 / 在线列表 ============ */
  var hbTimer = null, cleanTimer = null;

  function startHeartbeat() {
    if (hbTimer) clearInterval(hbTimer);
    if (cleanTimer) clearInterval(cleanTimer);
    hbTimer = setInterval(function () {
      publish({ t: 'heartbeat', user: username, time: Date.now() });
    }, HEARTBEAT_MS);
    cleanTimer = setInterval(function () {
      var now = Date.now(), changed = false;
      Object.keys(peers).forEach(function (u) {
        if (u === username) return;
        if (now - peers[u] > PEER_TIMEOUT) { delete peers[u]; changed = true; }
      });
      if (changed) renderPeers();
    }, 5000);
  }

  function touchPeer(name) {
    if (!name) return;
    var existed = !!peers[name];
    peers[name] = Date.now();
    if (!existed) renderPeers();
  }

  function dropPeer(name) {
    if (peers[name] && name !== username) {
      delete peers[name];
      renderPeers();
    }
  }

  function renderPeers() {
    var list = Object.keys(peers);
    list.sort(function (a, b) {
      if (a === username) return -1;
      if (b === username) return 1;
      return a.localeCompare(b, 'zh');
    });

    $('onlineCount').textContent = list.length;
    $('statusText').textContent  = list.length;
    $('status').className = connected ? 'on' : 'off';

    var box = $('peerList');
    box.innerHTML = '';
    list.forEach(function (u) {
      var d = document.createElement('div');
      d.className = 'peer' + (u === username ? ' me' : '');
      var dot = document.createElement('span');
      dot.className = 'dot';
      d.appendChild(dot);
      var txt = document.createElement('span');
      txt.textContent = u + (u === username ? '（我）' : '');
      d.appendChild(txt);
      box.appendChild(d);
    });
  }

  /* ============ 收消息 ============ */
  function onMessage(m) {
    if (m.t === 'join' || m.t === 'heartbeat') {
      if (m.user === username) return;
      touchPeer(m.user);
      if (m.t === 'join') {
        publish({ t: 'heartbeat', user: username, time: Date.now() });
      }
      return;
    }
    if (m.t === 'who') {
      if (m.user === username) return;
      publish({ t: 'heartbeat', user: username, time: Date.now() });
      return;
    }
    if (m.t === 'leave') {
      if (m.user === username) return;
      dropPeer(m.user);
      return;
    }

    if (m.t === 'msg') {
      if (seen[m.id]) return;
      seen[m.id] = 1;
      render(m);
      if (m.kind === 'text') saveText(m);
      return;
    }
    if (m.t === 'fstart') {
      if (seen[m.id]) return;
      incoming[m.id] = { meta: m, parts: new Array(m.n), got: 0 };
      return;
    }
    if (m.t === 'fchunk') {
      var f = incoming[m.id];
      if (!f || f.parts[m.i] !== undefined) return;
      f.parts[m.i] = m.d;
      f.got++;
      return;
    }
    if (m.t === 'fend') {
      var g = incoming[m.id];
      if (!g) return;
      delete incoming[m.id];
      if (g.got !== g.meta.n) return;
      var meta = g.meta;
      meta.data = g.parts.join('');
      render(meta);
      return;
    }
  }

  /* ============ 渲染消息 ============ */
  function render(m) {
    var msgs = $('msgs');

    var wrap = document.createElement('div');
    wrap.className = 'msg' + (m.user === username ? ' me' : '');

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = m.user + ' · ' + timeStr(m.time);
    wrap.appendChild(meta);

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (m.kind === 'text') {
      bubble.textContent = m.text;
    } else if (m.kind === 'image') {
      bubble.className += ' media';
      var img = document.createElement('img');
      img.src = m.data; img.alt = m.name || '图片'; img.loading = 'lazy';
      img.onclick = function () { lightbox(m.data); };
      bubble.appendChild(img);
    } else if (m.kind === 'video') {
      bubble.className += ' media';
      var v = document.createElement('video');
      v.src = m.data; v.controls = true; v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.preload = 'metadata';
      bubble.appendChild(v);
    } else if (m.kind === 'audio') {
      bubble.className += ' media';
      var a = document.createElement('audio');
      a.src = m.data; a.controls = true;
      bubble.appendChild(a);
    } else {
      var link = document.createElement('a');
      link.href = m.data;
      link.download = m.name || 'file';
      link.textContent = '📎 ' + (m.name || '文件') + ' (' + sizeStr(m.size) + ')';
      bubble.appendChild(link);
    }

    wrap.appendChild(bubble);
    msgs.appendChild(wrap);

    if (isNearBottom) msgs.scrollTop = msgs.scrollHeight;
  }

  var isNearBottom = true;
  $('msgs').addEventListener('scroll', function () {
    var el = $('msgs');
    isNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  });

  function lightbox(src) {
    var d = document.createElement('div');
    d.className = 'lightbox';
    var im = document.createElement('img');
    im.src = src;
    d.appendChild(im);
    d.onclick = function () { document.body.removeChild(d); };
    document.body.appendChild(d);
  }

  /* ============ 本地历史 ============ */
  function histKey() { return 'chat_history_' + username; }

  function saveText(m) {
    try {
      var h = JSON.parse(store(histKey()) || '[]');
      h.push({ id: m.id, user: m.user, time: m.time, kind: 'text', text: m.text });
      if (h.length > 300) h = h.slice(h.length - 300);
      store(histKey(), JSON.stringify(h));
    } catch (e) {}
  }

  function loadHistory() {
    var h;
    try { h = JSON.parse(store(histKey()) || '[]'); } catch (e) { h = []; }
    for (var i = 0; i < h.length; i++) {
      seen[h[i].id] = 1;
      render(h[i]);
    }
    $('msgs').scrollTop = $('msgs').scrollHeight;
  }

  /* ============ 发文本 ============ */
  function sendText() {
    var el = $('input');
    var text = el.value.trim();
    if (!text) return;
    if (!connected) return;

    var m = {
      t: 'msg', id: uid(), user: username, time: Date.now(),
      kind: 'text', text: text
    };
    seen[m.id] = 1;
    render(m);
    saveText(m);
    publish(m);

    el.value = '';
    autoGrow();
    el.focus();
  }

  /* ============ 发文件 ============ */
  function sendFile(file) {
    if (file.size > MAX_FILE) {
      alert('文件太大，最大支持 ' + sizeStr(MAX_FILE));
      return;
    }
    if (!connected) { alert('未连接，请稍后重试'); return; }

    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = reader.result;
      var type = file.type || '';
      var kind = 'file';
      if (type.indexOf('image/') === 0) kind = 'image';
      else if (type.indexOf('video/') === 0) kind = 'video';
      else if (type.indexOf('audio/') === 0) kind = 'audio';

      var id = uid();
      var n  = Math.ceil(dataUrl.length / CHUNK) || 1;

      var local = {
        t: 'fstart', id: id, user: username, time: Date.now(),
        name: file.name, size: file.size, mime: type, kind: kind,
        n: n, data: dataUrl
      };
      seen[id] = 1;
      render(local);

      publish({
        t: 'fstart', id: id, user: username, time: local.time,
        name: file.name, size: file.size, mime: type, kind: kind, n: n
      });
      for (var i = 0; i < n; i++) {
        publish({ t: 'fchunk', id: id, i: i, d: dataUrl.substr(i * CHUNK, CHUNK) });
      }
      publish({ t: 'fend', id: id });
    };
    reader.onerror = function () { alert('读取文件失败'); };
    reader.readAsDataURL(file);
  }

  /* ============ 输入区 ============ */
  var input = $('input');

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendText();
    }
  });

  $('sendBtn').onclick = sendText;
  $('fileBtn').onclick = function () { $('fileInput').click(); };

  $('fileInput').onchange = function (e) {
    var files = e.target.files;
    if (!files || !files.length) return;
    var arr = Array.prototype.slice.call(files);
    for (var i = 0; i < arr.length; i++) sendFile(arr[i]);
    e.target.value = '';
  };

  window.addEventListener('resize', function () {
    $('msgs').scrollTop = $('msgs').scrollHeight;
  });

  /* ============ 侧边栏：点击 + 手势 ============ */
  var sidebar = $('sidebar');
  var mask    = $('mask');

  function openSidebar() {
    sidebar.style.transition = '';
    sidebar.style.transform = '';
    mask.style.transition = '';
    mask.style.opacity = '';
    sidebar.classList.add('open');
    mask.classList.add('open');
  }
  function closeSidebar() {
    sidebar.style.transition = '';
    sidebar.style.transform = '';
    mask.style.transition = '';
    mask.style.opacity = '';
    sidebar.classList.remove('open');
    mask.classList.remove('open');
  }

  $('status').addEventListener('click', function () {
    if (sidebar.classList.contains('open')) closeSidebar();
    else openSidebar();
  });

  mask.addEventListener('click', closeSidebar);

  /* --- 手势：从右边缘往左划 --- */
  var dragging = false, startX = 0, startY = 0, sbWidth = 0;

  document.addEventListener('touchstart', function (e) {
    if (sidebar.classList.contains('open')) return;
    var t = e.touches[0];
    if (t.clientX >= window.innerWidth - 40) {
      dragging = true;
      startX = t.clientX;
      startY = t.clientY;
      sbWidth = sidebar.offsetWidth;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    var t = e.touches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;

    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) {
      dragging = false;
      sidebar.style.transition = '';
      sidebar.style.transform = '';
      mask.style.transition = '';
      mask.style.opacity = '';
      return;
    }
    if (dx > 0) return;

    var pos = Math.max(0, Math.min(sbWidth, sbWidth + dx));
    sidebar.style.transition = 'none';
    sidebar.style.transform = 'translateX(' + pos + 'px)';
    mask.style.transition = 'none';
    mask.style.opacity = String(1 - pos / sbWidth);
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (!dragging) return;
    dragging = false;
    var dx = e.changedTouches[0].clientX - startX;

    sidebar.style.transition = '';
    mask.style.transition = '';
    void sidebar.offsetWidth;
    sidebar.style.transform = '';
    mask.style.opacity = '';

    if (dx < -sbWidth / 3) {
      sidebar.classList.add('open');
      mask.classList.add('open');
    } else {
      sidebar.classList.remove('open');
      mask.classList.remove('open');
    }
  }, { passive: true });

  document.addEventListener('touchcancel', function () {
    if (!dragging) return;
    dragging = false;
    sidebar.style.transition = '';
    sidebar.style.transform = '';
    mask.style.transition = '';
    mask.style.opacity = '';
    sidebar.classList.remove('open');
    mask.classList.remove('open');
  }, { passive: true });

  /* ============ 离开时广播 ============ */
  window.addEventListener('beforeunload', function () {
    publish({ t: 'leave', user: username });
  });

})();
</script>
